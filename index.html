<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Advent Calendar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #0b1724;
      --card-bg: #152235;
      --accent: #e63946;
      --accent-soft: #f1faee;
      --gold: #f4c95d;
      --locked: #4a5568;
      --text: #f9fafb;
      --secondary-text: #cbd5f5;
      --shadow: 0 18px 35px rgba(0, 0, 0, 0.35);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 40px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;

      background:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.10), rgba(0, 0, 0, 0.15)),
        url("bg.jpg") center/cover no-repeat;

      color: var(--text);
      display: flex;
      min-height: 100vh;
      align-items: flex-start;
      justify-content: center;
    }

    @media (min-width: 900px) {
      body {
        padding: 32px 24px;
        align-items: center;
      }
    }

    .calendar-wrapper {
      max-width: 2000px;
      width: 100%;
      margin: 0 auto;
      position: relative;
    }

    .calendar-header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    @media (max-width: 600px) {
      .calendar-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }

    .calendar-title {
      font-size: clamp(1.6rem, 2.2vw + 1rem, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .calendar-title span.emoji {
      font-size: 1.8rem;
    }

    .calendar-subtitle {
      font-size: 0.9rem;
      color: var(--secondary-text);
      max-width: 480px;
    }

    .today-indicator {
      font-size: 0.9rem;
      color: var(--gold);
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.3);
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .today-indicator {
        margin-top: 4px;
      }
    }

    .today-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.75);
    }

    /* ------- GRID LAYOUT -------- */

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(80px, 1fr));
      grid-auto-rows: clamp(80px, 9vw, 130px);
      grid-auto-flow: dense;
      gap: clamp(8px, 1vw, 16px);
    }

    @media (max-width: 1200px) {
      .calendar-grid {
        grid-template-columns: repeat(6, minmax(80px, 1fr));
      }
    }

    @media (max-width: 900px) {
      .calendar-grid {
        grid-template-columns: repeat(5, minmax(70px, 1fr));
        grid-auto-rows: clamp(80px, 11vw, 120px);
      }
    }

    @media (max-width: 768px) {
      .calendar-grid {
        grid-template-columns: repeat(4, minmax(70px, 1fr));
        grid-auto-rows: clamp(90px, 18vw, 130px);
      }
    }

    @media (max-width: 520px) {
      .calendar-grid {
        grid-template-columns: repeat(3, minmax(80px, 1fr));
        grid-auto-rows: 110px;
      }
    }

    .door--size-s {
      grid-column: span 1;
      grid-row: span 1;
    }

    .door--size-wide {
      grid-column: span 2;
      grid-row: span 1;
    }

    .door--size-tall {
      grid-column: span 1;
      grid-row: span 2;
    }

    .door--size-big {
      grid-column: span 2;
      grid-row: span 2;
    }

    @media (max-width: 520px) {
      .door--size-s,
      .door--size-wide,
      .door--size-tall,
      .door--size-big {
        grid-column: span 1;
        grid-row: span 1;
      }
    }

    .door {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: var(--radius);
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      background-color: transparent;
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.65);
      padding: 10px;
      cursor: default;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease,
        filter 0.18s ease;
    }

    @media (max-width: 520px) {
      .door {
        padding: 8px;
      }
    }

    .door * {
      position: relative;
      z-index: 3;
    }

    /* Grey-out past doors */
    .door.past {
      filter: grayscale(0.4) brightness(0.9);
    }

    .door.past::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      pointer-events: none;
      z-index: 2;
    }

    .door.past .door-status {
      background: rgba(31, 41, 55, 0.9);
      border-color: rgba(148, 163, 184, 0.7);
    }

    .door::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(251, 191, 36, 0.28),
        rgba(248, 250, 252, 0.02)
      );
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .door.available {
      cursor: pointer;
    }

    .door.available:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 35px rgba(15, 23, 42, 0.9);
      border-color: rgba(248, 250, 252, 0.6);
    }

    .door.available:hover::before {
      opacity: 1;
    }

    .door.locked {
      border-style: dashed;
      border-color: rgba(148, 163, 184, 0.5);
      background: radial-gradient(circle at 20% 0, #111827, #020617);
    }

    .door-number {
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent-soft);
      align-self: flex-start;
      padding: 4px 14px;
      border-radius: 12px;
      background: linear-gradient(
        120deg,
        rgba(248, 250, 252, 0.12),
        rgba(248, 250, 252, 0.02)
      );
      backdrop-filter: blur(6px);
    }

    @media (max-width: 520px) {
      .door-number {
        font-size: 1.1rem;
        padding: 3px 8px;
      }
    }

    .door-label {
      font-size: 3rem;
      font-weight: 900;
      color: black;
      text-transform: none;
      letter-spacing: 0.02em;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      -webkit-text-stroke: 2px #f4c95d;
      text-stroke: 2px #f4c95d;
      text-shadow:
        0 0 8px rgba(244, 201, 93, 0.9),
        0 0 15px rgba(244, 201, 93, 0.6),
        0 0 22px rgba(244, 201, 93, 0.4);
      z-index: 3;
      pointer-events: none;
    }

    @media (max-width: 520px) {
      .door-label {
        font-size: 1.8rem;
      }
    }

    .door-footer {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      color: var(--secondary-text);
      opacity: 0.9;
      gap: 4px;
    }

    @media (max-width: 520px) {
      .door-footer {
        font-size: 0.65rem;
      }
    }

    .door-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.6);
    }

    .door-status span.icon {
      font-size: 0.9rem;
    }

    .door.locked .door-status {
      border-color: rgba(156, 163, 175, 0.6);
    }

    .door.available .door-status {
      border-color: rgba(248, 250, 252, 0.7);
      background: rgba(22, 163, 74, 0.08);
    }

    .door-tag {
      padding: 3px 6px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(191, 219, 254, 0.4);
      white-space: nowrap;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-backdrop.visible {
      display: flex;
    }

    .modal {
      width: min(1280px, 100vw - 32px);
      max-height: min(1280px, 90vh);
      background: radial-gradient(circle at top, #1f2937, #020617);
      padding: 24px 26px 20px;
      border-radius: 20px;
      border: 1px solid rgba(191, 219, 254, 0.5);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.75);
      position: relative;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 4px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-title span.badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 4px 7px;
      border-radius: 999px;
      background: rgba(22, 163, 74, 0.08);
      border: 1px solid rgba(22, 163, 74, 0.4);
      color: #bbf7d0;
    }

    .modal-close {
      border: none;
      background: transparent;
      color: var(--secondary-text);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: transform 0.1s ease, color 0.1s ease;
    }

    .modal-close:hover {
      transform: scale(1.1);
      color: #e5e7eb;
    }

    .modal-body {
      font-size: 0.95rem;
      color: var(--secondary-text);
      line-height: 1.5;
      overflow-y: auto;
      padding-right: 4px;
    }

    .modal-body a {
      color: #93c5fd;
      text-decoration: none;
    }

    .modal-body a:hover {
      text-decoration: underline;
    }

    .modal-footer {
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--secondary-text);
      opacity: 0.9;
    }

    @media (max-width: 520px) {
      .modal-footer {
        flex-direction: column;
        gap: 6px;
      }
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.7);
    }

    .pill span.icon {
      font-size: 0.9rem;
    }

    .sparkles {
      pointer-events: none;
      position: absolute;
      inset: 0;
      mix-blend-mode: screen;
      background-image: radial-gradient(
          circle at 10% 20%,
          rgba(255, 255, 255, 0.35) 0,
          transparent 40%
        ),
        radial-gradient(
          circle at 80% 10%,
          rgba(255, 255, 255, 0.28) 0,
          transparent 42%
        ),
        radial-gradient(
          circle at 30% 80%,
          rgba(255, 255, 255, 0.25) 0,
          transparent 40%
        );
      background-size: 380px 380px;
      animation: drift 35s linear infinite alternate;
      opacity: 0.4;
    }

    @keyframes drift {
      from {
        transform: translate3d(-10px, 10px, 0);
      }
      to {
        transform: translate3d(10px, -10px, 0);
      }
    }

    /* Secret message styles */
    .secret-message-container {
      text-align: center;
      padding: 20px;
    }

    .secret-input {
      padding: 10px;
      font-size: 16px;
      border: 2px solid var(--gold);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      margin: 10px 0;
    }

    .fireplace-container {
      text-align: center;
    }

    .fireplace-iframe {
      width: 100%;
      max-width: 560px;
      height: 315px;
      border: none;
      border-radius: 12px;
    }

    .memory-photo {
      max-width: 100%;
      border-radius: 14px;
      margin: 10px 0;
    }

    .hug-card {
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, rgba(230, 57, 70, 0.1), rgba(244, 201, 93, 0.1));
      border-radius: 12px;
      border: 1px solid rgba(244, 201, 93, 0.3);
    }
  </style>
</head>
<body>
  <div class="calendar-wrapper">
    <div class="sparkles" aria-hidden="true"></div>

    <header class="calendar-header">
      <div>
        <div class="calendar-title">
          <span class="emoji">🎄</span>
          <span>Nancy's Advent Calendar</span>
        </div>
        <div class="calendar-subtitle">
          Come back each day to open a new door and reveal today's surprise.
        </div>
      </div>
      <div class="today-indicator" id="todayIndicator">
        <span class="today-dot"></span>
        <span id="todayText">Today: —</span>
      </div>
    </header>

    <main class="calendar-grid" id="calendarGrid"></main>
  </div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">
          <span id="modalEmoji">🎁</span>
          <span id="modalTitleText">Day X</span>
          <span class="badge" id="modalBadge">Unlocked</span>
        </h2>
        <button class="modal-close" id="modalClose" aria-label="Close">
          &times;
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <div class="pill">
          <span class="icon">📅</span>
          <span id="modalDayLabel">Door X</span>
        </div>
        <div class="pill">
          <span class="icon">✨</span>
          <span>Come back tomorrow for more</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- CONFIG: content for each day ---
    const doorContent = {
        1: {
        title: "Day 1 – Welcome to Your Calendar",
        emoji: "🎁",
        html: `
          <div class="secret-message-container">
            <img src="inside-1.gif" alt="Welcome animation" class="welcome-gif">
            <h3>Hi Süße 💖</h3>
            <p>Welcome to your first advent calendar! For the next 24 days, I will surprise you a little bit every day.</p>
            <p>I will also remind you every day of why I love you.</p>
            <div style="background: rgba(244, 201, 93, 0.1); padding: 15px; border-radius: 8px; margin: 15px 0;">
              <p><strong>1.</strong> I love the way you support me and when tell me that you are proud of me</p>
            </div>
            <p>For your first surprise, type three magical words in here:</p>
            <input type="text" class="secret-input" placeholder="Type the magic words..." id="secretInput">
            <audio id="loveMessage" src="day1.m4a" preload="auto"></audio>
          </div>
        `,
      },

       2: {
        title: "Day 2 – Cozy Fireplace",
        emoji: "🔥",
        html: `
          <div class="fireplace-container">
            <p>Let's get cozy and pretend we're curled up together.</p>
            <video class="fireplace-iframe" controls autoplay muted loop style="width: 100%; max-width: 560px; height: 315px; border-radius: 12px;">
              <source src="fireplace-video.mp4" type="video/mp4">
            </video>
            
            <div style="text-align: center; margin: 25px 0;">
              <div style="background: rgba(244, 201, 93, 0.1); padding: 20px; border-radius: 12px; display: inline-block;">
                <p style="margin: 0; font-size: 1.2em;"><strong>2.</strong> I love that you didn't give up on me</p>
              </div>
            </div>

            <audio id="fireplaceAudio" autoplay loop>
              <source src="fireplace-audio.mp4" type="audio/mp4">
            </audio>
          </div>
          <script>
            // Attempt to play audio when modal opens
            setTimeout(() => {
              const audio = document.getElementById('fireplaceAudio');
              if (audio) {
                audio.play().catch(e => {
                  console.log('Autoplay with sound was blocked');
                });
              }
            }, 1000);
          <\/script>
        `,
      },

      3: {
        title: "Day 3 – A Memory in a Photo",
        emoji: "📸",
        html: `
          <div style="text-align: center;">
            <img src="day-3-memory.jpg" alt="Our special memory" class="memory-photo">
            <p><strong>Do you remember this day?</strong></p>
            <p>I was looking at our picture and remembering our first night :). 
            The way it felt to be with you made me realize that I want to be with you forever.</p> 
          </div>
  <div style="text-align: center; margin: 25px 0;">
              <div style="background: rgba(244, 201, 93, 0.1); padding: 20px; border-radius: 12px; display: inline-block;">
                <p style="margin: 0; font-size: 1.2em;"><strong>3.</strong> I love your eyes</p>
              </div>
            <p>This memory lives forever in my mind because it captures exactly why I love being with you.</p>
        `,
      },

      4: {
        title: "Day 4 – Virtual Hug",
        emoji: "🤗",
        html: `
          <div style="text-align: center; padding: 20px;">
            <div id="hugEmoji" style="font-size: 5rem; margin: 30px 0; transition: all 0.5s ease;">🫂</div>
            
            <h2 style="color: var(--gold); margin-bottom: 25px; font-size: 1.8em;">A Warm Virtual Hug Just For You</h2>
            
            <div style="background: rgba(244, 201, 93, 0.1); padding: 25px; border-radius: 15px; margin: 25px 0; border: 2px solid rgba(244, 201, 93, 0.3);">
              <p style="margin: 0; font-size: 1.3em; line-height: 1.6;">
                <strong>4.</strong> I love how safe I feel when I'm with you
              </p>
            </div>
            
            <div style="background: rgba(230, 57, 70, 0.1); padding: 20px; border-radius: 12px; margin: 20px 0;">
              <p style="margin: 0; font-size: 1.1em; line-height: 1.5;">
                This is your virtual hug! Scroll up again after clicking the button 💖
              </p>
            </div>
            
            <button onclick="
              const hugEmoji = document.getElementById('hugEmoji');
              const message = document.getElementById('hugMessage');
              const button = this;
              
              hugEmoji.classList.add('hug-active');
              button.style.transform = 'scale(0.9)';
              button.innerHTML = '🤗 HUGGING YOU...';
              button.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
              
              setTimeout(() => {
                button.style.transform = 'scale(1.1)';
                button.innerHTML = '🤗 HUG SENT!';
                message.style.display = 'block';
                message.scrollIntoView({ behavior: 'smooth', block: 'center' });
              }, 600);
            " style="padding: 18px 35px; background: linear-gradient(135deg, var(--accent), var(--gold)); 
                      color: white; border: none; border-radius: 50px; font-size: 1.3em; cursor: pointer; 
                      margin: 25px 0; transition: all 0.3s ease; font-weight: bold;">
              🤗 CLICK FOR A BIG HUG
            </button>
            
            <div id="hugMessage" style="display: none; background: rgba(34, 197, 94, 0.1); padding: 20px; 
                     border-radius: 12px; margin: 20px 0; border: 2px solid rgba(34, 197, 94, 0.3);">
              <p style="margin: 0; color: #22c55e; font-weight: bold; font-size: 1.2em;">
                💝 HUG INITIATED! Feel my arms wrapping around you? I'm holding you extra tight!
              </p>
            </div>
          </div>
          
          <style>
            @keyframes bigPulse {
              0% { 
                transform: scale(1); 
                filter: drop-shadow(0 0 10px rgba(244, 201, 93, 0.5));
              }
              50% { 
                transform: scale(1.3); 
                filter: drop-shadow(0 0 25px rgba(244, 201, 93, 0.8));
              }
              100% { 
                transform: scale(1); 
                filter: drop-shadow(0 0 10px rgba(244, 201, 93, 0.5));
              }
            }
            
            .hug-active {
              font-size: 8rem !important;
              animation: bigPulse 1.5s ease-in-out infinite !important;
            }
          </style>
        `,
      },

      5: {
        title: "Day 5 – Our Shared Diary",
        emoji: "📖",
        html: `
          <div style="text-align: center; padding: 20px;">
            <div style="font-size: 4rem; margin: 20px 0;">💝</div>
            
            <h2 style="color: var(--gold); margin-bottom: 20px;">Let's Write Our Story Together</h2>
            
            <div style="background: rgba(244, 201, 93, 0.1); padding: 25px; border-radius: 15px; margin: 25px 0; border: 2px solid rgba(244, 201, 93, 0.3);">
              <p style="margin: 0; font-size: 1.3em; line-height: 1.6;">
                <strong>5.</strong> I love our daily calls
              </p>
            </div>
            
            <div style="background: rgba(148, 163, 184, 0.1); padding: 20px; border-radius: 12px; margin: 20px 0;">
              <p style="margin: 0; font-size: 1.1em; line-height: 1.5;">
                I've started our shared diary with a message for you. 
                Add your thoughts, write back to me, or just share what's on your mind - I'll see it instantly! ✨
              </p>
            </div>
            
            <a href="https://etherpad.wikimedia.org/p/NancyAdvent2024" target="_blank" 
               style="display: inline-block; padding: 15px 30px; background: linear-gradient(135deg, var(--accent), #059669); 
                      color: white; text-decoration: none; border-radius: 50px; margin: 20px 0; font-size: 1.2em; 
                      font-weight: bold; transition: transform 0.3s ease;">
              📖 OPEN OUR SHARED DIARY
            </a>
          </div>
        `,
      },

      6: {
        title: "Day 6 – For My Strong Girl",
        emoji: "💪",
        html: `
          <div style="text-align: center; padding: 20px;">
            <div id="day6Content">

12: {
  title: "Day 12 – Memory Jar",
  emoji: "🫙",
  html: `
    <div style="text-align: center; padding: 20px;">
      <div style="font-size: 4rem; margin: 20px 0;">🫙</div>
      
      <h2 style="color: var(--gold); margin-bottom: 25px;">Our Memory Jar</h2>
      
      <div style="background: rgba(244, 201, 93, 0.1); padding: 25px; border-radius: 15px; margin: 25px 0; border: 2px solid rgba(244, 201, 93, 0.3);">
        <p style="margin: 0; font-size: 1.3em; line-height: 1.6;">
          <strong>12.</strong> I love every memory we've made together
        </p>
      </div>
      
      <div style="background: rgba(148, 163, 184, 0.1); padding: 20px; border-radius: 12px; margin: 20px 0; max-width: 500px; margin-left: auto; margin-right: auto;">
        <p style="margin: 0; font-size: 1.1em; line-height: 1.5;">
          Click the jar to shake it and reveal a random memory from our journey together.
        </p>
      </div>
      
      <!-- Memory Jar with inline onclick -->
      <div onclick="
        // Shake animation
        this.style.transform = 'scale(0.95)';
        setTimeout(() => this.style.transform = 'scale(1)', 200);
        
        // Get elements
        const display = document.getElementById('memoryDisplay');
        const content = document.getElementById('memoryContent');
        const counter = document.getElementById('shakeCount');
        
        // Define memories
        const memories = [
          'The first hug in Basel - That moment we finally held each other 🤗',
          'Reconnecting December 1st, 2024 and talking daily every since 💌',
          'Your first voice note on Boo - Hearing your voice for the first time 🎵',
          'Our first kiss at Zürich airport 💋',
          'When I cook for you 🍳',
          'Our first shower together... hopefully in a warm place next time :D 🚿',
          'Our first time sleeping with each other 💝',
          'Day-long video calls - Talking for hours without noticing time 📞',
          'Giving you full body massages and the way we connect through them 💆‍♀️',
          'Your morning voice messages - Waking up to your voice 🌅',
          'Our journey through Switzerland-Austria-Czechia ✈️',
          'Our future travel plans all over the world 🗺️',
          '\\'Exacto, Ginette!\\' 😂',
          'When we amuse each either with our stupid jokes 😄',
          'When we watch something together in peace 🍿',
          'Realizing I want to spend my life with you ❤️',
          'When you brought me the Nancy balls the first time we met 🍫',
          'Our video calls until late night 🌙',
          'Overcoming the many challenges to be together 💪',
          'You falling asleep in my arms 😴',
          'The way you call me \\'Patricio\\' 🗣️',
          'The expectation of getting your first good morning message ☀️',
          'Every time we laugh together =) 🎉'
        ];
        
        // Initialize or get current state from data attributes
        let availableMemories = this.getAttribute('data-memories') ? JSON.parse(this.getAttribute('data-memories')) : [...memories];
        let shakeCount = parseInt(this.getAttribute('data-count') || '0');
        
        if (availableMemories.length === 0) {
          // All memories shown
          content.innerHTML = '&lt;div style=&quot;font-size: 3rem; margin-bottom: 15px;&quot;&gt;🎉&lt;/div&gt;&lt;h3 style=&quot;color:var(--gold);margin-bottom:10px;&quot;&gt;You\\'ve seen all our memories!&lt;/h3&gt;&lt;p style=&quot;color:var(--text);&quot;&gt;But don\\'t worry - we\\'re making new ones every day 💖&lt;/p&gt;&lt;button onclick=&quot;document.getElementById(\\'memoryJar\\').setAttribute(\\'data-memories\\', \\'\\'); document.getElementById(\\'memoryJar\\').setAttribute(\\'data-count\\', \\'0\\'); document.getElementById(\\'shakeCount\\').textContent = \\'0\\'; document.getElementById(\\'memoryDisplay\\').style.display = \\'none\\';&quot; style=&quot;padding:10px 20px;background:rgba(34,197,94,0.2);color:white;border:2px solid #22c55e;border-radius:20px;cursor:pointer;margin-top:15px;font-weight:bold;&quot;&gt;🔄 Shake Again&lt;/button&gt;';
          display.style.display = 'block';
          return;
        }
        
        // Pick random memory
        const randomIndex = Math.floor(Math.random() * availableMemories.length);
        const memory = availableMemories[randomIndex];
        availableMemories.splice(randomIndex, 1);
        
        // Update count
        shakeCount++;
        counter.textContent = shakeCount;
        
        // Update jar data attributes
        this.setAttribute('data-memories', JSON.stringify(availableMemories));
        this.setAttribute('data-count', shakeCount);
        
        // Display memory
        display.style.display = 'block';
        content.innerHTML = '&lt;div style=&quot;font-size: 3rem; margin-bottom: 15px;&quot;&gt;' + memory.split(' ').pop() + '&lt;/div&gt;&lt;h3 style=&quot;color:var(--gold);margin-bottom:10px;&quot;&gt;Memory #' + shakeCount + '&lt;/h3&gt;&lt;p style=&quot;color:var(--text);font-size:1.2em;line-height:1.5;margin:0;&quot;&gt;' + memory.substring(0, memory.lastIndexOf(' ')) + '&lt;/p&gt;';
      " 
      id="memoryJar" 
      style="width: 300px; height: 400px; background: linear-gradient(to bottom, #a855f7, #8b5cf6, #7c3aed); border-radius: 100px 100px 150px 150px; margin: 30px auto; position: relative; cursor: pointer; box-shadow: 0 20px 40px rgba(139, 92, 246, 0.3); border: 8px solid #7c3aed; overflow: hidden; transition: transform 0.3s ease;">
        <!-- Jar lid -->
        <div style="position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 320px; height: 30px; background: linear-gradient(to bottom, #f59e0b, #d97706); border-radius: 50%; z-index: 2; box-shadow: 0 5px 15px rgba(0,0,0,0.2);"></div>
        
        <!-- Default jar content -->
        <div style="position: relative; z-index: 3; padding: 40px 20px; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;">
          <div style="font-size: 4rem; margin-bottom: 20px;">✨</div>
          <p style="color: white; font-size: 1.2em; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">
            Click to shake the jar...
          </p>
        </div>
      </div>
      
      <!-- Memory Display Area -->
      <div id="memoryDisplay" style="min-height: 150px; background: rgba(30, 41, 59, 0.3); border-radius: 15px; margin: 20px 0; padding: 25px; display: none;">
        <div id="memoryContent" style="text-align: center;"></div>
      </div>
      
      <!-- Shake Counter -->
      <div style="margin: 20px 0; padding: 10px; background: rgba(139, 92, 246, 0.1); border-radius: 20px; display: inline-block;">
        <p style="margin: 0; color: var(--secondary-text); font-size: 0.9em;">
          Memories revealed: <span id="shakeCount" style="color: var(--gold); font-weight: bold;">0</span>/23
        </p>
      </div>
      
      <div style="margin-top: 30px; padding-top: 20px; border-top: 2px dashed rgba(148, 163, 184, 0.3);">
        <p style="color: var(--secondary-text); font-size: 0.9em; margin: 0;">
          Each click reveals a new memory - some sweet, some funny, all special 💖
        </p>
      </div>
    </div>
  `,
},

            <p style="margin: 0; color: var(--secondary-text); font-size: 0.8em;">Snow Depth</p>
            <p id="snowDepth15" style="margin: 0; color: #0ea5e9; font-size: 1.5em; font-weight: bold;">25%</p>
          </div>
          
          <div style="padding: 10px 15px; background: rgba(255,255,255,0.1); border-radius: 15px; min-width: 120px;">
            <p style="margin: 0; color: var(--secondary-text); font-size: 0.8em;">Magic Used</p>
            <p id="magicCount15" style="margin: 0; color: #8b5cf6; font-size: 1.5em; font-weight: bold;">0</p>
          </div>
        </div>
      </div>
      
      <!-- Message -->
      <div style="margin-top: 30px; padding: 20px; background: rgba(30, 41, 59, 0.3); border-radius: 12px; max-width: 500px; margin-left: auto; margin-right: auto;">
        <p style="color: var(--text); margin: 0; font-style: italic;">
          "Every snowflake that falls is a wish I'm making for our future together ❄️💫"
        </p>
      </div>
    </div>
    
    <style>
      @keyframes float15 {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(280px) rotate(360deg); opacity: 0; }
      }
      
      @keyframes twinkle15 {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      
      @keyframes wave15 {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-30deg); }
        75% { transform: rotate(30deg); }
      }
      
      @keyframes heartbeat15 {
        0%, 100% { transform: translateX(-50%) scale(1); }
        50% { transform: translateX(-50%) scale(1.2); }
      }
      
      @keyframes flyAcross15 {
        0% { transform: translateX(-100px) translateY(50px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateX(400px) translateY(20px); opacity: 0; }
      }
      
      @keyframes starTrail15 {
        0% { transform: translateX(-100px) translateY(100px) rotate(0deg); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateX(400px) translateY(-50px) rotate(360deg); opacity: 0; }
      }
    </style>
    
    <script>
      // Initialize with some snow
      setTimeout(() => {
        const container = document.getElementById('snowflakesContainer15');
        const counter = document.getElementById('snowCount15');
        
        if (container && counter) {
          for (let i = 0; i < 10; i++) {
            setTimeout(() => {
              const snowflake = document.createElement('div');
              snowflake.innerHTML = '❄️';
              snowflake.style.position = 'absolute';
              snowflake.style.color = 'white';
              snowflake.style.fontSize = (Math.random() * 15 + 10) + 'px';
              snowflake.style.left = Math.random() * 100 + '%';
              snowflake.style.top = Math.random() * 30 + '%';
              snowflake.style.opacity = Math.random() * 0.7 + 0.3;
              snowflake.style.pointerEvents = 'none';
              snowflake.style.zIndex = '10';
              snowflake.style.animation = 'float15 ' + (Math.random() * 3 + 2) + 's linear forwards';
              
              container.appendChild(snowflake);
              
              // Update counter
              counter.textContent = parseInt(counter.textContent || 0) + 1;
              
              // Remove after animation
              setTimeout(() => {
                if (snowflake.parentNode) {
                  snowflake.parentNode.removeChild(snowflake);
                }
              }, 5000);
            }, i * 100);
          }
        }
        
        // Start heart beating
        const heart = document.getElementById('beatingHeart15');
        setInterval(() => {
          heart.style.animation = 'heartbeat15 1s ease-in-out';
          setTimeout(() => heart.style.animation = '', 1000);
        }, 5000);
        
        // Make lights twinkle occasionally
        setInterval(() => {
          if (Math.random() > 0.7) {
            const randomLight = ['#light115', '#light215', '#light315'][Math.floor(Math.random() * 3)];
            const light = document.querySelector(randomLight);
            if (light) {
              light.style.animation = 'twinkle15 0.5s ease-in-out';
              setTimeout(() => light.style.animation = '', 500);
            }
          }
        }, 3000);
      }, 500);
    <\/script>
  `
},
    };

    // --- Build calendar dynamically ---
    const grid = document.getElementById("calendarGrid");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalClose = document.getElementById("modalClose");
    const modalTitleText = document.getElementById("modalTitleText");
    const modalEmoji = document.getElementById("modalEmoji");
    const modalBody = document.getElementById("modalBody");
    const modalDayLabel = document.getElementById("modalDayLabel");
    const modalBadge = document.getElementById("modalBadge");
    const todayText = document.getElementById("todayText");

    const today = new Date();
    const currentDay = today.getDate();
    const currentMonth = today.getMonth() + 1; // 1–12

    // CHANGED: Force current month behavior for testing (remove this line for December)
    const isAdventMonth = (currentMonth === today.getMonth() + 1);

    todayText.textContent = `Today: ${today.toLocaleDateString(undefined, {
      day: "numeric",
      month: "short",
      year: "numeric",
    })}`;

    const totalDoors = 24;
    const days = Array.from({ length: totalDoors }, (_, i) => i + 1);

    // Shuffle doors
    for (let i = days.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [days[i], days[j]] = [days[j], days[i]];
    }

    const specialDays = new Set([1, 6, 24]);

    function randomSizeClass() {
      const options = ["door--size-s", "door--size-wide", "door--size-tall"];
      const idx = Math.floor(Math.random() * options.length);
      return options[idx];
    }

    for (const day of days) {
      const door = document.createElement("button");
      door.className = "door";
      door.setAttribute("type", "button");
      door.dataset.day = String(day);

      // background image for the door tile
      door.style.backgroundImage = `url("door-${day}.jpg")`;

      const isPast = isAdventMonth && day < currentDay;
      const isToday = isAdventMonth && day === currentDay;
      const available = isAdventMonth && day <= currentDay;

      door.classList.add(available ? "available" : "locked");
      if (isPast) door.classList.add("past");

      if (specialDays.has(day)) {
        door.classList.add("door--size-big");
      } else {
        door.classList.add(randomSizeClass());
      }

      let statusIcon = "🔒";
      let statusText = "Locked";
      let tagText = "Soon";

      if (available) {
        statusIcon = "🔓";
        if (isPast) {
          statusText = "Opened";
          tagText = "Earlier";
        } else if (isToday) {
          statusText = "Today";
          tagText = "Open me";
        }
      }

      door.innerHTML = `
        <div class="door-number">${day}</div>
        <div class="door-label">Day ${day}</div>
        <div class="door-footer">
          <div class="door-status">
            <span class="icon">${statusIcon}</span>
            <span>${statusText}</span>
          </div>
          <div class="door-tag">${tagText}</div>
        </div>
      `;

      if (available) {
        door.addEventListener("click", () => openDoor(day));
      }

      grid.appendChild(door);
    }

    function openDoor(day) {
      const content = doorContent[day] || {
        title: `Day ${day}`,
        emoji: "🎁",
        html: "<p>No content defined yet. Add something fun here!</p>",
      };

      modalTitleText.textContent = content.title;
      modalEmoji.textContent = content.emoji;
      modalBody.innerHTML = content.html;
      modalDayLabel.textContent = `Door ${day}`;
      modalBadge.textContent =
        day < currentDay ? "Previously opened" : "Today's door";

      modalBackdrop.classList.add("visible");

      // Re-initialize any interactive elements in the modal
      if (day === 1) {
        setTimeout(() => {
          const secretInput = document.getElementById('secretInput');
          const loveMessage = document.getElementById('loveMessage');
          if (secretInput && loveMessage) {
            secretInput.addEventListener('input', function(e) {
              if (e.target.value.toLowerCase() === 'i love you') {
                loveMessage.play();
                e.target.style.borderColor = '#22c55e';
                e.target.style.background = 'rgba(34, 197, 94, 0.1)';
              }
            });
          }
        }, 100);
      }
    }

    function closeModal() {
      modalBackdrop.classList.remove("visible");
    }

    modalClose.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });
  </script>
</body>
</html>
